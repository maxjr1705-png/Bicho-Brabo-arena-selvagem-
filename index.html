{v:'0.8.6',n:'BICHO-X ÚNICO POR BICHO',t:[

{v:'0.8.5',n:'ESPECIAIS E AGARRES ÚNICOS',t:[

{v:'0.8.4',n:'DEFESA, DANO E IMPACTO',t:[

G.mode=2;G.train=0;G.pick=m.p1;G.pick2=m.p2;G.map=m.map;G.who=0;G.paused=0;RS=m.seed|0;ONL.D=m.D;ONL.f=0;ONL.capF=0;ONL.tq=[];ONL.inp=[{},{}];for(let i=0;i<m.D;i++){ONL.inp[0][i]=0;ONL.inp[1][i]=0}ONL.hs={};ONL.ph={};ONL.hist=[];ONL.desync=0;ONL.stall=0;ONL.rm=[0,0];ONL.stage='fight';ONL.run=1;clrIn();buildCtl();startMatch()}

$('rm').onclick=()=>onlQuit(1);
if(ONL.rm[1-ONL.side]){}}

const hash32=t=>{let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};

if(!o||o.t!==1||!o.k||typeof o.k!=='object')return'Esse código é de outro formato.';for(const k of EXPK)if(o.k[k]!=null){if(typeof o.k[k]!=='string')return'Código danificado.';try{JSON.parse(o.k[k])}catch(e){return'Código danificado.'}}
